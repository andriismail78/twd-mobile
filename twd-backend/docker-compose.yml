version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: twd_postgres
    restart: always
    environment:
      POSTGRES_USER: twd_user
      POSTGRES_PASSWORD: twd_password_secure
      POSTGRES_DB: twd_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: twd_backend_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: twd_user
      DB_PASS: twd_password_secure
      DB_NAME: twd_production
      JWT_SECRET: twd_super_secret_jwt_key_2026
    depends_on:
      - db

volumes:
  pgdata:
