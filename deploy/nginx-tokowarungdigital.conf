# deploy/nginx-tokowarungdigital.conf
# Taruh di KVM (srv1808009.hstgr.cloud / 62.72.20.24) sebagai:
#   /etc/nginx/sites-available/tokowarungdigital.com
#   lalu symlink ke /etc/nginx/sites-enabled/
#
# Setelah file ini aktif, jalankan:
#   sudo certbot --nginx -d tokowarungdigital.com
# (certbot akan mengubah blok ini agar pakai sertifikat SSL otomatis)

server {
    listen 80;
    server_name tokowarungdigital.com www.tokowarungdigital.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect ke HTTPS (certbot akan isi otomatis)
    location / {
        return 301 https://$host$request_uri;
    }
}

